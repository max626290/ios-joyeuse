name: Experimental iOS package
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare tools and disk
        run: |
          brew install llvm blacktop/tap/ipsw
          # Ephemeral hosted runner only; this job does not use Xcode.
          sudo rm -rf /Applications/Xcode_*.app
          npm install --no-save @actions/artifact@6.3.1
          df -h .
      - name: Build and transfer encrypted package
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_TRANSFER_PASSWORD: ${{ secrets.ROOT_TRANSFER_PASSWORD }}
        run: bash tools/build-ios-package.sh
      - name: Transfer encrypted parts within free quota
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_FILE: out/package.tar.gz.enc
        with:
          script: await require(process.env.GITHUB_WORKSPACE + '/tools/upload-parts.cjs')
